name = "luki-stickers-cloudflare-ai"
main = "worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

[[unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 0.1
[observability.traces]
enabled = true
head_sampling_rate = 0.01
