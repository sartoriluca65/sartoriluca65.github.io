<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terapia Manager • Clinical Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root{
  --bg:#f4f7fa; --surface:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
  --primary:#0d9488; --primary-dark:#0f766e; --primary-soft:#e0f5f2;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --green:#16a34a; --green-soft:#dcfce7;
  --blue:#2563eb; --blue-soft:#dbeafe;
  --orange:#ea580c; --orange-soft:#ffedd5;
  --red:#dc2626; --red-soft:#fee2e2;
  --gray-soft:#f1f5f9;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sh:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --sh-lg:0 12px 30px -8px rgba(15,23,42,.18);
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh;display:flex}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* SIDEBAR */
.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;z-index:50;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:20px}
.brand b{font-size:16px;letter-spacing:-.01em;display:block}
.brand small{color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav-group{margin-bottom:18px}
.nav-group .lbl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:0 10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);
  font-weight:500;cursor:pointer;border:1px solid transparent;transition:.12s}
.nav-item i{font-size:18px;width:20px;text-align:center}
.nav-item:hover{background:var(--primary-soft);color:var(--primary)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.nav-item .tag{margin-left:auto;font-size:10px;background:var(--primary);color:#fff;padding:1px 7px;border-radius:20px;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px}
.user{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--gray-soft);border-radius:var(--r-sm)}
.user .av{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700}
.user b{font-size:13px;display:block}
.user small{color:var(--ink-3);font-size:11px}

/* MAIN */
.main{margin-left:248px;padding:28px 34px;max-width:1280px;flex:1}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.topbar h1{font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.topbar h1 i{color:var(--primary)}
.topbar p{color:var(--ink-2);margin-top:3px}
.actions{display:flex;gap:9px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;
  font-weight:600;border:1px solid transparent;transition:.12s;white-space:nowrap}
.btn i{font-size:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--gray-soft)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--sh);transition:.15s}
.stat:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.stat .row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.stat .row .lbl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stat .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px}
.ico.teal{background:var(--primary-soft);color:var(--primary)}
.ico.green{background:var(--green-soft);color:var(--green)}
.ico.blue{background:var(--blue-soft);color:var(--blue)}
.ico.orange{background:var(--orange-soft);color:var(--orange)}
.stat .val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;align-items:center;gap:5px}

/* CARD / TABLE */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:16px;font-weight:600}
.panel-head p{font-size:12px;color:var(--ink-3);margin-top:2px}
.search{position:relative}
.search input{padding:9px 12px 9px 34px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:13px;width:220px;font-family:inherit}
.search input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:16px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:12px 20px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--gray-soft);border-bottom:1px solid var(--border)}
tbody td{padding:13px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--gray-soft)}
.p-name{font-weight:600}
.p-code{font-family:var(--mono);background:var(--gray-soft);padding:2px 7px;border-radius:4px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-active{background:var(--green-soft);color:#15803d}
.b-chronic{background:var(--blue-soft);color:#1d4ed8}
.b-pending{background:var(--orange-soft);color:#c2410c}
.b-resolved{background:var(--gray-soft);color:var(--ink-2)}
.iconbtn{width:32px;height:32px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-sm);
  display:inline-grid;place-items:center;font-size:15px;color:var(--ink-2);transition:.12s}
.iconbtn:hover{background:var(--gray-soft);color:var(--ink)}
.iconbtn.del:hover{background:var(--red-soft);color:var(--red);border-color:#fecaca}
.iconbtn.ed:hover{background:var(--blue-soft);color:var(--blue);border-color:#bfdbfe}
.empty{text-align:center;padding:40px;color:var(--ink-3)}
.empty i{font-size:34px;margin-bottom:8px;display:block}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:var(--sh-lg);max-height:92vh;overflow:auto;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head .x{border:none;background:none;font-size:20px;color:var(--ink-3);cursor:pointer}
.modal-head .x:hover{color:var(--ink)}
.modal-body{padding:22px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.fg .req{color:var(--red)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:var(--gray-soft)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform
