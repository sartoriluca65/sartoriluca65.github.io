<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terapia Demo - Sistema Backup Funzionante</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phosphor-icons/phosphor.js"></script>
<style>
:root {
  --bs-primary: #0d9488;
  --bs-primary-rgb: 13, 148, 136;
}
body { background-color: #f4f7f9; }
</style>
</head>
<body>
<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <h1 class="text-primary"><i class="ph-bold ph-heart-pulse"></i> Terapia Manager</h1>
      <p class="text-muted">Gestione patologie con backup locale sicuro</p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="row mb-4">
    <div class="col-12 col-md-4 mb-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <div class="display-6 text-primary fw-bold" id="totalPatologie">0</div>
          <small class="text-muted">Totale Patologie</small>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4 mb-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <div class="display-6 text-success fw-bold" id="terapieAttive">0</div>
          <small class="text-muted">Terapie Attive</small>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4 mb-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <div class="display-6 text-info fw-bold" id="ultimoBackup">N/D</div>
          <small class="text-muted">Ultimo Backup</small>
        </div>
      </div>
    </div>
  </div>

  <!-- Azioni -->
  <div class="row mb-4">
    <div class="col-12 d-flex flex-wrap gap-2">
      <button class="btn btn-primary" onclick="openModal('nuova')">
        <i class="ph-bold ph-plus"></i> Nuova Patologia
      </button>
      <button class="btn btn-outline-secondary" onclick="document.getElementById('importFile').click()">
        <i class="ph-bold ph-upload"></i> Importa Backup
      </button>
      <button class="btn btn-outline-success" onclick="exportData()">
        <i class="ph-bold ph-download"></i> Esporta Backup
      </button>
      <button class="btn btn-outline-info" onclick="verifyBackupIntegrity()">
        <i class="ph-bold ph-shield-check"></i> Verifica Integrità
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
    </div>
  </div>

  <!-- Tabella -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          Elenco Patologie
        </div>
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Codice ICD-10</th>
                <th>Categoria</th>
                <th>Stato</th>
                <th>Data</th>
                <th>Note</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody id="patologieTable">
              <!-- Popolato dinamicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nuova/Modifica -->
<div class="modal fade" id="patologiaModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="patologiaForm">
        <div class="modal-header">
          <h5 class="modal-title">Nuova Patologia</h5>
          <button type="button" class="btn-close" onclick="closeModal()"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="patologiaId">
          
          <div class="mb-3">
            <label class="form-label">Nome Patologia *</label>
            <input type="text" class="form-control" id="nomePatologia" required>
          </div>
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Codice ICD-10</label>
              <input type="text" class="form-control" id="codiceIcd" placeholder="Es. I10">
            </div>
            <div class="col-md-6">
              <label class="form-label">Categoria *</label>
              <select class="form-select" id="categoriaPatologia" required>
                <option value="">Seleziona...</option>
                <option>Cardiologia</option>
                <option>Neurologia</option>
                <option>Ortopedia</option>
                <option>Psicologia</option>
                <option>Endocrinologia</option>
                <option>Altro</option>
              </select>
            </div>
          </div>
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Stato *</label>
              <select class="form-select" id="statoPatologia" required>
                <option value="">Seleziona...</option>
                <option value="active">Attiva</option>
                <option value="chronic">Cronica</option>
                <option value="pending">In osservazione</option>
                <option value="resolved">Risolta</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Data Diagnosi</label>
              <input type="date" class="form-control" id="dataDiagnosi">
            </div>
          </div>
          
          <div class="mb-3">
            <label class="form-label">Note Cliniche</label>
            <textarea class="form-control" id="noteCliniche" rows="3" placeholder="Dettagli terapeutici, dosaggi, follow-up..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
          <button type="submit" class="btn btn-primary">Salva</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Configurazione backup
const BACKUP_KEYS = {
  primary: 'terapiaPatologiePrimary',
  backup: 'terapiaPatologieBackup',
  timestamp: 'terapiaLastBackup'
};

// Stati patologie
const STATUS_MAP = {
  'active': { label: 'Attiva', class: 'badge bg-success' },
  'chronic': { label: 'Cronica', class: 'badge bg-info' },
  'pending': { label: 'In Osservazione', class: 'badge bg-warning text-dark' },
  'resolved': { label: 'Risolta', class: 'badge bg-secondary' }
};

// Dati predefiniti
const DEFAULT_DATA = [
  { id: Date.now()-3, name: 'Ipertensione arteriosa', code: 'I10', category: 'Cardiologia', status: 'chronic', date: '2023-05-12', notes: 'Controllo trimestrale con ACE inibitori' },
  { id: Date.now()-2, name: 'Diabete mellito tipo 2', code: 'E11', category: 'Endocrinologia', status: 'active', date: '2023-08-01', notes: 'HbA1c 6.8%, terapia con metformina' },
  { id: Date.now()-1, name: 'Ansia generalizzata', code: 'F41.1', category: 'Psicologia', status: 'pending', date: '2023-10-03', notes: 'Valutazione psicoterapia' }
];

// Carica dati con backup sicuro
function loadData() {
  try {
    const primary = localStorage.getItem(BACKUP_KEYS.primary);
    const backup = localStorage.getItem(BACKUP_KEYS.backup);
    const timestamp = localStorage.getItem(BACKUP_KEYS.timestamp);
    
    if (primary) {
      const data = JSON.parse(primary);
      if (Array.isArray(data)) return data;
    }
    
    if (backup) {
      const data = JSON.parse(backup);
      if (Array.isArray(data)) {
        localStorage.setItem(BACKUP_KEYS.primary, backup);
        return data;
      }
    }
    
    return DEFAULT_DATA;
  } catch(e) {
    console.error("Errore nel caricamento dati:", e);
    return DEFAULT_DATA;
  }
}

// Salva dati con backup doppio
function saveData(data) {
  try {
    const dataStr = JSON.stringify(data);
    localStorage.setItem(BACKUP_KEYS.primary, dataStr);
    localStorage.setItem(BACKUP_KEYS.backup, dataStr);
    const now = new Date();
    localStorage.setItem(BACKUP_KEYS.timestamp, now.toISOString());
    return true;
  } catch(e) {
    console.error("Errore nel salvataggio:", e);
    return false;
  }
}

// Esporta dati
function exportData() {
  let data = loadData();
  const dataStr = JSON.stringify(data, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `terapia-backup-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert("✅ Backup esportato con successo!");
}

// Importa dati
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let data = JSON.parse(e.target.result);
      
      // Validazione estesa - accetta anche formati leggermente diversi
      if (!Array.isArray(data)) {
        if (data && typeof data === 'object' && Array.isArray(data.patologie)) {
          data = data.patologie;
        } else {
          throw new Error("Formato non valido");
        }
      }
      
      // Normalizza i campi mancanti
      data = data.map(item => ({
        id: item.id || Date.now(),
        name: item.name || item.nome || item.nomePatologia || 'Senza nome',
        code: item.code || item.codice || '',
        category: item.category || item.categoria || 'Altro',
        status: item.status || item.stato || 'active',
        date: item.date || item.data || new Date().toISOString().split('T')[0],
        notes: item.notes || item.note || ''
      }));
      
      if (confirm(`Importare ${data.length} patologie? Questo sostituirà i dati attuali.`)) {
        saveData(data);
        renderList();
        updateStats();
        alert("✅ Importazione completata con successo!");
      }
    } catch(error) {
      console.error("Errore importazione:", error);
      alert("❌ Errore nella lettura del file:\n\n" + error.message + "\n\nAssicurati che sia un file JSON valido.");
    }
  };
  reader.readAsText(file);
  
  // Resetta l'input per permettere di r-caricare lo stesso file
  event.target.value = '';
}

// Verifica integrità backup
function verifyBackupIntegrity() {
  const primary = localStorage.getItem(BACKUP_KEYS.primary);
  const backup = localStorage.getItem(BACKUP_KEYS.backup);
  const timestamp = localStorage.getItem(BACKUP_KEYS.timestamp);

  let msg = "🔍 Verifica Integrità Backup:\n\n";
  
  msg += "✅ Backup Primario: ";
  try {
    const data = JSON.parse(primary);
    msg += `${Array.isArray(data) ? `OK (${data.length} record)` : 'Formato non valido'}\n`;
  } catch(e) {
    msg += "Non disponibile\n";
  }

  msg += "✅ Backup Secondario: ";
  try {
    const data = JSON.parse(backup);
    msg += `${Array.isArray(data) ? `OK (${data.length} record)` : 'Formato non valido'}\n`;
  } catch(e) {
    msg += "Non disponibile\n";
  }

  msg += `\nUltimo Backup: ${timestamp ? new Date(timestamp).toLocaleString() : 'Mai'}`;

  alert(msg);
}

// Renderizza la lista
function renderList() {
  const data = loadData();
  const tbody = document.getElementById('patologieTable');
  tbody.innerHTML = '';
  
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Nessuna patologia registrata</td></tr>';
  }
  
  data.forEach((p, i) => {
    const statusInfo = STATUS_MAP[p.status] || STATUS_MAP['pending'];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="fw-bold">${p.name}</td>
      <td><code>${p.code || '-'}</code></td>
      <td>${p.category}</td>
      <td><span class="${statusInfo.class}">${statusInfo.label}</span></td>
      <td>${p.date || '-'}</td>
      <td>${p.notes ? p.notes.substring(0, 50) + (p.notes.length > 50 ? '...' : '') : '-'}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="editPatologia(${p.id})">
          <i class="ph-bold ph-pencil"></i> Modifica
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deletePatologia(${p.id})">
          <i class="ph-bold ph-trash"></i> Elimina
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Aggiorna statistiche
function updateStats() {
  const data = loadData();
  document.getElementById('totalPatologie').textContent = data.length;
  document.getElementById('terapieAttive').textContent = 
    data.filter(p => p.status === 'active' || p.status === 'chronic').length;
  
  const timestamp = localStorage.getItem(BACKUP_KEYS.timestamp);
  document.getElementById('ultimoBackup').textContent = timestamp ? 
    new Date(timestamp).toLocaleTimeString() : 'N/D';
}

// Apri/Chiudi modale
function openModal(action = 'nuova', id = null) {
  document.getElementById('patologiaForm').reset();
  document.getElementById('patologiaId').value = '';
  document.getElementById('patologiaModal').classList.add('show');
  document.getElementById('patologiaModal').style.display = 'block';
  
  if (action === 'modifica' && id) {
    const data = loadData();
    const patologia = data.find(p => p.id == id);
    if (patologia) {
      document.querySelector('.modal-title').textContent = 'Modifica Patologia';
      document.getElementById('patologiaId').value = patologia.id;
      document.getElementById('nomePatologia').value = patologia.name;
      document.getElementById('codiceIcd').value = patologia.code;
      document.getElementById('categoriaPatologia').value = patologia.category;
      document.getElementById('statoPatologia').value = patologia.status;
      document.getElementById('dataDiagnosi').value = patologia.date;
      document.getElementById('noteCliniche').value = patologia.notes;
    }
  } else {
    document.querySelector('.modal-title').textContent = 'Nuova Patologia';
  }
  
  // Chiudi cliccando fuori
  window.onclick = function(e) {
    if (e.target === document.getElementById('patologiaModal')) {
      closeModal();
    }
  };
}

function closeModal() {
  document.getElementById('patologiaModal').classList.remove('show');
  document.getElementById('patologiaModal').style.display = 'none';
}

// Salva patologia
document.getElementById('patologiaForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const id = document.getElementById('patologiaId').value;
  const data = loadData();
  
  const patologia = {
    id: id ? parseInt(id) : Date.now(),
    name: document.getElementById('nomePatologia').value,
    code: document.getElementById('codiceIcd').value,
    category: document.getElementById('categoriaPatologia').value,
    status: document.getElementById('statoPatologia').value,
    date: document.getElementById('dataDiagnosi').value,
    notes: document.getElementById('noteCliniche').value
  };
  
  if (id) {
    const index = data.findIndex(p => p.id == id);
    if (index > -1) data[index] = patologia;
  } else {
    data.unshift(patologia);
  }
  
  saveData(data);
  renderList();
  updateStats();
  closeModal();
});

// Elimina patologia
function deletePatologia(id) {
  const data = loadData();
  const patologia = data.find(p => p.id == id);
  if (confirm(`Eliminare "${patologia?.name}"?`)) {
    const newData = data.filter(p => p.id != id);
    saveData(newData);
    renderList();
    updateStats();
  }
}

// Modifica patologia
function editPatologia(id) {
  openModal('modifica', id);
}

// Inizializza
document.addEventListener('DOMContentLoaded', function() {
  renderList();
  updateStats();
});

// Auto-salvataggio periodico
setInterval(() => {
  const data = loadData();
  saveData(data);
}, 30000);
</script>
</body>
</html>
