<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diviso</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Outfit:wght@420;620&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1c241c;--muted:#5d6a5c;--line:#e4ddd0;--paper:#f6f1e7;--card:#fffdf8;--green:#1f6b45;--terra:#c45c32}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:#ebe4d6}
.stage{min-height:100dvh;display:grid;place-items:center;padding:12px}
.phone{width:min(420px,100%);height:min(860px,100dvh);background:var(--paper);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(40,32,18,.16)}
header{padding:16px;display:flex;gap:10px;align-items:center}h1{font-size:18px;margin:0}h2{font-family:Fraunces,serif;font-size:28px;margin:8px 0}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}.screens{flex:1;overflow:auto;padding:0 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.pill{background:#fbe8df;color:#8a3b1d;border-radius:99px;padding:4px 10px;font-size:12px}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;margin-right:4px}
.tabs{display:flex;gap:6px;background:#efe8db;padding:4px;border-radius:14px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px}.tabs button.on{background:#fff}
.dock{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px}.btn{border:0;border-radius:14px;padding:14px;font-weight:700}.primary{background:var(--green);color:#f7f3ea;flex:1}.ghost{background:#fff;border:1px solid var(--line)}
.sheet{position:absolute;inset:0;background:rgba(28,36,28,.4);display:flex;align-items:flex-end}.box{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:16px;max-height:92%;overflow:auto}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;margin:4px}
.sum{background:#144d31;color:#f6f1e7;border-radius:18px;padding:14px;margin:10px 0}.big{font-family:Fraunces,serif;font-size:32px}
</style>
</head>
<body><div class="stage"><div class="phone" id="app"></div></div>
<script>
const C=['#1f6b45','#c45c32','#2f5d8a','#8a5a2f','#6b4c9a'];
const euro=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const uid=()=>Math.random().toString(36).slice(2,8);
let state=JSON.parse(localStorage.getItem('diviso-v1')||'null')||{trips:[{id:'roma',name:'Weekend a Roma',emoji:'🏛️',people:[{id:'tu',name:'Tu',color:C[0]},{id:'giulia',name:'Giulia',color:C[1]},{id:'marco',name:'Marco',color:C[2]},{id:'lea',name:'Lea',color:C[3]}],expenses:[{id:'e1',title:'Taxi da Termini',emoji:'🚕',amount:28,payer:'tu',shares:['tu','giulia','marco','lea']},{id:'e2',title:'Appartamento',emoji:'🏠',amount:240,payer:'giulia',shares:['tu','giulia','marco','lea']}],bills:[{id:'b1',title:'Trattoria da Enzo',payer:'marco',tax:10,tip:8,items:[{name:'Cacio e pepe',price:14,who:['tu','lea']},{name:'Carbonara',price:15,who:['giulia']},{name:'Amatriciana',price:14,who:['marco']},{name:'Supplì',price:6,who:['tu','giulia','marco','lea']},{name:'Vino',price:18,who:['tu','giulia','marco']}]}],settlements:[]}]};
let view={name:'home'};
const save=()=>localStorage.setItem('diviso-v1',JSON.stringify(state));
const trip=()=>state.trips.find(t=>t.id===view.tripId);
const person=(t,id)=>t.people.find(p=>p.id===id);
const ini=n=>n.slice(0,1);
function billMath(b){let items=0,sub={};b.items.forEach(it=>{items+=+it.price||0;if(it.who.length){const s=it.price/it.who.length;it.who.forEach(id=>sub[id]=(sub[id]||0)+s)}});const tax=items*(+b.tax||0)/100,tip=items*(+b.tip||0)/100,as=Object.values(sub).reduce((a,b)=>a+b,0)||1,tot={};Object.entries(sub).forEach(([id,v])=>tot[id]=v+(tax+tip)*v/as);return{items,tax,tip,grand:items+tax+tip,tot}}
function nets(t){const bal={};t.people.forEach(p=>bal[p.id]=0);t.expenses.forEach(e=>{const sh=e.shares.length?e.shares:t.people.map(p=>p.id);bal[e.payer]+=e.amount;sh.forEach(id=>bal[id]-=e.amount/sh.length)});t.bills.forEach(b=>{const m=billMath(b);bal[b.payer]+=m.grand;Object.entries(m.tot).forEach(([id,v])=>bal[id]-=v)});t.settlements.forEach(s=>{bal[s.from]+=s.amount;bal[s.to]-=s.amount});return bal}
function plan(bal){const d=[],c=[];Object.entries(bal).forEach(([id,v])=>{v=Math.round(v*100)/100;if(v<-0.01)d.push({id,v:-v});if(v>0.01)c.push({id,v})});d.sort((a,b)=>b.v-a.v);c.sort((a,b)=>b.v-a.v);const m=[];let i=0,j=0;while(i<d.length&&j<c.length){const pay=Math.min(d[i].v,c[j].v);if(pay>0.01)m.push({from:d[i].id,to:c[j].id,amount:Math.round(pay*100)/100});d[i].v-=pay;c[j].v-=pay;if(d[i].v<0.01)i++;if(c[j].v<0.01)j++}return m}
function render(){document.getElementById('app').innerHTML=view.name==='home'?home():tripView();bind()}
function home(){return `<header><div><h1>Diviso</h1><div class="sub">Conti e spese di gruppo</div></div></header><div class="screens"><h2>I tuoi gruppi</h2>${state.trips.map(t=>{const n=plan(nets(t)).length;return `<article class="card" data-open="${t.id}"><b>${t.emoji} ${t.name}</b><div>${t.people.map(p=>`<span class="av" style="background:${p.color}">${ini(p.name)}</span>`).join('')}</div><div class="pill">${n?n+' da saldare':'In pari'}</div></article>`}).join('')}</div><div class="dock"><button class="btn primary" id="new">Nuovo gruppo</button></div>${view.sheet==='new'?`<div class="sheet" id="sheet"><div class="box"><h2>Nuovo gruppo</h2><label>Nome</label><input id="tn" placeholder="Weekend"><label>Persone, separate da virgola</label><input id="tp" value="Tu, "><button class="btn primary" id="save-trip" style="width:100%;margin-top:12px">Crea</button></div></div>`:''}`}
function tripView(){const t=trip(),tab=view.tab||'feed';return `<header><button class="btn ghost" id="back">←</button><div><h1>${t.emoji} ${t.name}</h1></div></header><div class="screens"><div class="tabs"><button data-tab="feed" class="${tab==='feed'?'on':''}">Spese</button><button data-tab="bills" class="${tab==='bills'?'on':''}">Conti</button><button data-tab="bal" class="${tab==='bal'?'on':''}">Saldi</button></div>${tab==='feed'?feed(t):tab==='bills'?bills(t):bal(t)}</div><div class="dock">${tab==='bal'?`<button class="btn primary" id="settle">Segna un pagamento</button>`:tab==='bills'?`<button class="btn primary" id="bill">Conto</button>`:`<button class="btn primary" id="exp">Spesa</button>`}</div>${view.sheet==='exp'?expSheet(t):''}${view.sheet==='bill'?billSheet(t):''}${view.sheet==='settle'?setSheet(t):''}`}
function feed(t){const rows=[...t.expenses.map(e=>({...e,kind:'e'})),...t.bills.map(b=>({title:b.title,emoji:'🧾',amount:billMath(b).grand,payer:b.payer,id:b.id,kind:'b'}))];return rows.map(e=>`<div class="card" ${e.kind==='b'?`data-bill="${e.id}"`:''}><b>${e.emoji||'💶'} ${e.title}</b><div class="sub">${person(t,e.payer)?.name} ha pagato · ${euro(e.amount)}</div></div>`).join('')||'<p>Nessuna spesa.</p>'}
function bills(t){return t.bills.map(b=>`<div class="card" data-bill="${b.id}"><b>${b.title}</b><div>${euro(billMath(b).grand)} · ${b.items.length} voci</div></div>`).join('')||'<p>Nessun conto.</p>'}
function bal(t){const n=nets(t),m=plan(n),spent=t.expenses.reduce((s,e)=>s+e.amount,0)+t.bills.reduce((s,b)=>s+billMath(b).grand,0);return `<div class="sum"><div>Speso nel gruppo</div><div class="big">${euro(spent)}</div></div>${t.people.map(p=>`<div class="card"><span class="av" style="background:${p.color}">${ini(p.name)}</span><b>${p.name}</b> ${euro(n[p.id]||0)}</div>`).join('')}${m.map(x=>`<div class="card">${person(t,x.from).name} paga ${euro(x.amount)} a ${person(t,x.to).name}</div>`).join('')||'<p>Siete in pari.</p>'}`}
function expSheet(t){return `<div class="sheet" id="sheet"><div class="box"><h2>Nuova spesa</h2><label>Cosa</label><input id="et"><label>Importo</label><input id="ea" type="number"><label>Ha pagato</label><select id="ep">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><label>Divisa tra</label><div id="shares">${t.people.map(p=>`<button type="button" class="chip on" data-id="${p.id}">${p.name}</button>`).join('')}</div><button class="btn primary" id="save-exp" style="width:100%;margin-top:12px">Aggiungi</button></div></div>`}
function setSheet(t){return `<div class="sheet" id="sheet"><div class="box"><h2>Pagamento fatto</h2><label>Da</label><select id="sf">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><label>A</label><select id="st">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><label>Importo</label><input id="sa" type="number"><button class="btn primary" id="save-set" style="width:100%;margin-top:12px">Registra</button></div></div>`}
function billSheet(t){const b=view.bill,m=billMath(b);return `<div class="sheet" id="sheet"><div class="box"><h2>Conto</h2><label>Locale</label><input id="bt" value="${b.title}"><label>Ha pagato</label><select id="bp">${t.people.map(p=>`<option value="${p.id}" ${p.id===b.payer?'selected':''}>${p.name}</option>`).join('')}</select><label>Tassa %</label><input id="bx" type="number" value="${b.tax}"><label>Mancia %</label><input id="bi" type="number" value="${b.tip}"><label>Scontrino, una voce per riga</label><textarea id="bpaste" placeholder="Cacio e pepe 14"></textarea><button class="btn ghost" id="parse">Leggi le righe</button>${b.items.map((it,i)=>`<div class="card"><input data-n="${i}" value="${it.name}"><input data-p="${i}" type="number" value="${it.price}"><div>${t.people.map(p=>`<button type="button" class="chip ${it.who.includes(p.id)?'on':''}" data-who="${i}" data-id="${p.id}" style="${it.who.includes(p.id)?'background:'+p.color+';color:#fff':''}">${p.name}</button>`).join('')}</div></div>`).join('')}<button class="btn ghost" id="add-item">+ Voce</button><div class="sum"><div class="big">${euro(m.grand)}</div><div>${Object.entries(m.tot).map(([id,v])=>person(t,id).name+' '+euro(v)).join(' · ')||'Assegna le voci'}</div></div><button class="btn primary" id="save-bill" style="width:100%">Salva conto</button></div></div>`}
function sync(){const b=view.bill;if(!b)return;b.title=document.getElementById('bt').value;b.payer=document.getElementById('bp').value;b.tax=+document.getElementById('bx').value||0;b.tip=+document.getElementById('bi').value||0;document.querySelectorAll('[data-n]').forEach(el=>b.items[el.dataset.n].name=el.value);document.querySelectorAll('[data-p]').forEach(el=>b.items[el.dataset.p].price=+el.value||0)}
function bind(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{view={name:'trip',tripId:el.dataset.open,tab:'feed'};render()});
const back=document.getElementById('back');if(back)back.onclick=()=>{view={name:'home'};render()};
const nw=document.getElementById('new');if(nw)nw.onclick=()=>{view.sheet='new';render()};
const st=document.getElementById('save-trip');if(st)st.onclick=()=>{const name=document.getElementById('tn').value||'Gruppo';const people=document.getElementById('tp').value.split(',').map(s=>s.trim()).filter(Boolean).map((n,i)=>({id:uid(),name:n,color:C[i%C.length]}));state.trips.unshift({id:uid(),name,emoji:'✨',people,expenses:[],bills:[],settlements:[]});save();view={name:'trip',tripId:state.trips[0].id,tab:'feed'};render()};
document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{view.tab=el.dataset.tab;view.sheet=null;render()});
document.querySelectorAll('[data-bill]').forEach(el=>el.onclick=()=>{view.bill=JSON.parse(JSON.stringify(trip().bills.find(b=>b.id===el.dataset.bill)));view.sheet='bill';render()});
const exp=document.getElementById('exp');if(exp)exp.onclick=()=>{view.sheet='exp';view.shares=trip().people.map(p=>p.id);render()};
const bill=document.getElementById('bill');if(bill)bill.onclick=()=>{view.bill={id:uid(),title:'Nuovo conto',payer:trip().people[0].id,tax:0,tip:0,items:[{name:'Piatto',price:0,who:[]}]};view.sheet='bill';render()};
const settle=document.getElementById('settle');if(settle)settle.onclick=()=>{view.sheet='settle';render()};
const sheet=document.getElementById('sheet');if(sheet)sheet.onclick=e=>{if(e.target.id==='sheet'){view.sheet=null;render()}};
document.querySelectorAll('#shares .chip').forEach(el=>el.onclick=()=>{el.classList.toggle('on')});
const se=document.getElementById('save-exp');if(se)se.onclick=()=>{const t=trip();const shares=[...document.querySelectorAll('#shares .chip.on')].map(el=>el.dataset.id);t.expenses.unshift({id:uid(),title:document.getElementById('et').value||'Spesa',emoji:'💶',amount:+document.getElementById('ea').value||0,payer:document.getElementById('ep').value,shares:shares.length?shares:t.people.map(p=>p.id)});save();view.sheet=null;render()};
const ss=document.getElementById('save-set');if(ss)ss.onclick=()=>{const from=document.getElementById('sf').value,to=document.getElementById('st').value,amount=+document.getElementById('sa').value||0;if(from!==to&&amount>0){trip().settlements.push({from,to,amount});save()}view.sheet=null;render()};
document.querySelectorAll('[data-who]').forEach(el=>el.onclick=()=>{sync();const it=view.bill.items[el.dataset.who];const id=el.dataset.id;it.who=it.who.includes(id)?it.who.filter(x=>x!==id):[...it.who,id];render()});
const ai=document.getElementById('add-item');if(ai)ai.onclick=()=>{sync();view.bill.items.push({name:'Voce',price:0,who:[]});render()};
const parse=document.getElementById('parse');if(parse)parse.onclick=()=>{sync();const lines=document.getElementById('bpaste').value.split('\n').map(s=>s.trim()).filter(Boolean);const parsed=lines.map(line=>{const m=line.match(/^(.*?)\s+(\d+[.,]\d+|\d+)\s*€?$/);return m?{name:m[1],price:+m[2].replace(',','.'),who:[]}:null}).filter(Boolean);if(parsed.length)view.bill.items=parsed;render()};
const sb=document.getElementById('save-bill');if(sb)sb.onclick=()=>{sync();const t=trip();const i=t.bills.findIndex(b=>b.id===view.bill.id);if(i>=0)t.bills[i]=view.bill;else t.bills.unshift(view.bill);save();view.sheet=null;view.tab='bills';render()}}
render();
</script></body></html>
