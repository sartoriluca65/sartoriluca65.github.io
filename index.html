<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diviso</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,640&family=Outfit:wght@420;650&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#2a2118;--muted:#7a6a58;--paper:#fff8ee}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#ffe7c2,#fff8ee 42%)}
.app{max-width:440px;margin:0 auto;min-height:100dvh;padding:16px}
.card{background:#fff;border-radius:24px;padding:14px;margin:10px 0;box-shadow:0 8px 20px rgba(180,90,30,.08)}
h1{font-family:Fraunces,serif;font-size:32px;margin:4px 0;line-height:1}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:flex-start}
.bubble{width:46px;height:46px;border-radius:16px;background:#fff1d6;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:6px;background:#ffe7c2;padding:4px;border-radius:16px}.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px;font-weight:650}.tabs button.on{background:#fff}
.chip{border:0;border-radius:99px;padding:7px 10px;margin:3px;background:#fff1d6}.chip.on{background:#ef6b3c;color:#fff}
.btn{border:0;border-radius:16px;padding:13px;font-weight:700;background:#ef6b3c;color:#fff;width:100%}.ghost{background:#2a2118}
.sum{background:#2a2118;color:#fff8ee;border-radius:22px;padding:16px}
input{width:100%;border:0;background:#fff6e8;border-radius:12px;padding:10px;font:inherit;margin-top:6px}
.tag{font-size:11px;background:#ffe7c2;border-radius:99px;padding:2px 8px}
</style></head><body><div class="app" id="app"></div>
<script>
const euro=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const pizza='<svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#f0c14a"/><path d="M16 5l6 11h-6z" fill="#e25b3a"/></svg>';
const cake='<svg width="28" height="28" viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="12" rx="4" fill="#f2b8c6"/><rect x="15" y="6" width="2" height="8" fill="#e25b3a"/></svg>';
const beer='<svg width="28" height="28" viewBox="0 0 32 32"><rect x="8" y="8" width="12" height="18" rx="3" fill="#f0c14a"/></svg>';
const icon=n=>/dolce|torta|dessert/i.test(n)?cake:/birra|vino|acqua|bibita|coca/i.test(n)?beer:pizza;
const kind=n=>/dolce|torta|dessert/i.test(n)?'Dolce':/birra|vino|acqua|bibita|coca|caffe/i.test(n)?'Bibita':'Pietanza';
const people=[{id:'tu',name:'Tu'},{id:'giulia',name:'Giulia'},{id:'marco',name:'Marco'}];
let bill=JSON.parse(localStorage.getItem('diviso-scan')||'null')||{title:'Cena',payer:'tu',items:[{name:'Pizza mista',price:9,who:['tu']},{name:'Pizza dolce',price:7,who:['giulia']},{name:'Birra media',price:5,who:['tu','marco']}]};
let tab='piatti', msg='';
const save=()=>localStorage.setItem('diviso-scan',JSON.stringify(bill));
const who=id=>people.find(p=>p.id===id);
function math(){let tot=0,sub={};bill.items.forEach(it=>{tot+=+it.price||0;const w=it.who||[];if(w.length){const s=(+it.price||0)/w.length;w.forEach(id=>sub[id]=(sub[id]||0)+s)}});return{tot,sub}}
function render(){const m=math();document.getElementById('app').innerHTML=`<div class="card"><div class="sub">Libero, senza account</div><h1>Chi ha mangiato cosa</h1><p class="sub">Ogni pietanza e ogni bibita va a chi l'ha presa. Lo scontrino prepara le righe.</p></div><div class="tabs"><button data-tab="piatti" class="${tab==='piatti'?'on':''}">Pietanze</button><button data-tab="saldi" class="${tab==='saldi'?'on':''}">Speso</button></div>${tab==='saldi'?saldi(m):piatti()}<div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" id="scan">Scansiona scontrino</button><button class="btn" id="add">+ Voce</button></div><input id="cam" type="file" accept="image/*" capture="environment" hidden>${msg?`<p class="sub">${msg}</p>`:''}`;bind()}
function piatti(){return bill.items.map((it,i)=>`<div class="card row"><div class="bubble">${icon(it.name)}</div><div style="flex:1"><span class="tag">${kind(it.name)}</span> <b>${it.name}</b><div class="sub">${euro(it.price)} · se in più, si divide</div><div>${people.map(p=>`<button class="chip ${(it.who||[]).includes(p.id)?'on':''}" data-i="${i}" data-id="${p.id}">${p.name}</button>`).join('')}</div><input data-n="${i}" value="${it.name}"><input data-p="${i}" type="number" value="${it.price}"></div></div>`).join('')}
function saldi(m){return `<div class="sum"><div class="sub" style="color:#f0d7b0">Totale scontrino</div><div style="font-family:Fraunces,serif;font-size:34px">${euro(m.tot)}</div></div>${people.map(p=>{const lines=bill.items.filter(it=>(it.who||[]).includes(p.id));const share=m.sub[p.id]||0;return `<div class="card"><b>${p.name}</b> ha speso ${euro(share)}<div class="sub">${lines.map(it=>it.name+' '+euro((+it.price)/(it.who.length||1))).join(' · ')||'niente'}</div></div>`}).join('')}${people.filter(p=>p.id!==bill.payer&& (m.sub[p.id]||0)>0).map(p=>`<div class="card">${p.name} passa ${euro(m.sub[p.id])} a ${who(bill.payer).name}, che ha pagato il conto</div>`).join('')}`}
function parseLines(text){return text.split(/\n/).map(s=>s.trim()).map(line=>{const m=line.match(/^(.*?)\s+(\d+[.,]\d{2}|\d+[.,]\d+|\d+)\s*€?$/);if(!m)return null;const name=m[1].replace(/[*\-]+/g,'').trim();if(name.length<2||/totale|subtot|contanti|resto|iva/i.test(name))return null;return{name,price:+m[2].replace(',','.'),who:[]}}).filter(Boolean)}
async function scan(file){msg='Leggo lo scontrino... la prima volta scarica il lettore e può volerci un po\'.';render();try{if(!window.Tesseract){await new Promise((ok,err)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=err;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'ita+eng');const items=parseLines(r.data.text||'');if(items.length){bill.items=items;save();msg='Trovate '+items.length+' voci. Controlla prezzi e assegna chi ha mangiato.';}else msg='Non ho trovato prezzi. Aggiungi le voci a mano.';}catch(e){msg='Lettura non riuscita. Puoi scrivere le pietanze a mano.'}render()}
function readInputs(){document.querySelectorAll('[data-n]').forEach(el=>{if(bill.items[el.dataset.n])bill.items[el.dataset.n].name=el.value});document.querySelectorAll('[data-p]').forEach(el=>{if(bill.items[el.dataset.p])bill.items[el.dataset.p].price=+el.value||0})}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{readInputs();tab=b.dataset.tab;save();render()});
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{readInputs();const it=bill.items[b.dataset.i];it.who=it.who||[];it.who=it.who.includes(b.dataset.id)?it.who.filter(x=>x!==b.dataset.id):[...it.who,b.dataset.id];save();render()});
const add=document.getElementById('add');if(add)add.onclick=()=>{readInputs();bill.items.push({name:'Bibita',price:0,who:[]});save();render()};
const scanBtn=document.getElementById('scan');const cam=document.getElementById('cam');if(scanBtn)scanBtn.onclick=()=>cam.click();if(cam)cam.onchange=()=>{if(cam.files[0])scan(cam.files[0])}}
render();
</script></body></html>
