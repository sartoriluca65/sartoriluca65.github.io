<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diviso — registrati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Outfit:wght@400;560;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#17211b;--muted:#5d6b62;--line:#e4ddd2;--paper:#f4efe6;--card:#fffdf8;--green:#1c6b45;--green-d:#124832}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:radial-gradient(800px 400px at 10% -10%,#efe4c8,transparent 50%),#ebe4d6}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.nav{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center;font-weight:700}.mark{width:36px;height:36px;border-radius:12px;background:var(--green);color:#f6f1e7;display:grid;place-items:center;font-family:Fraunces,serif}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-top:28px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
h1{font-family:Fraunces,serif;font-size:46px;line-height:1;margin:8px 0 12px;letter-spacing:-.03em}
.lead{color:var(--muted);font-size:18px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 16px 40px rgba(40,32,18,.08)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:560}
input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;background:#fff}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#f7f3ea;width:100%}.ghost{background:transparent;color:var(--green-d)}
.err{color:#8a3b1d;font-size:13px;min-height:18px}.ok{background:#e7f5ec;color:#124832;border-radius:12px;padding:10px;font-size:13px;margin-bottom:8px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}@media(max-width:800px){.feats{grid-template-columns:1fr}}
.feat{background:rgba(255,253,248,.7);border:1px solid var(--line);border-radius:18px;padding:14px}
.app{max-width:420px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative}
header.appbar{padding:16px;display:flex;gap:10px;align-items:center}h2{font-family:Fraunces,serif;margin:8px 0}
.screens{padding:0 16px 100px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.tabs{display:flex;gap:6px;background:#efe8db;padding:4px;border-radius:14px}.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px}.tabs button.on{background:#fff}
.dock{position:sticky;bottom:12px;display:flex;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;margin:3px}
.chip.on{color:#fff;border-color:transparent}.sum{background:#124832;color:#f6f1e7;border-radius:16px;padding:14px}
</style></head><body>
<div id="root"></div>
<script>
const C=['#1c6b45','#c45c32','#2f5d8a','#8a5a2f','#6b4c9a'];
const euro=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const uid=()=>Math.random().toString(36).slice(2,8);
const users=JSON.parse(localStorage.getItem('diviso-users')||'{}');
let session=JSON.parse(localStorage.getItem('diviso-session')||'null');
let auth={mode:'landing',err:''};
let appState=JSON.parse(localStorage.getItem('diviso-v3')||'null')||{trips:[{id:'demo',name:'Cena di prova',people:[{id:'tu',name:'Tu',color:C[0]},{id:'a',name:'Giulia',color:C[1]},{id:'b',name:'Marco',color:C[2]}],expenses:[],bills:[{id:'b1',title:'Pizzeria',payer:'tu',tax:0,tip:0,items:[{name:'Pizza mista',type:'Pizza',price:9,who:['tu']},{name:'Pizza butta',type:'Pizza',price:10,who:['a']},{name:'Birra',type:'Bibita',price:5,who:['tu','b']}]}],settlements:[]}]};
let view={name:'home'};
const saveU=()=>localStorage.setItem('diviso-users',JSON.stringify(users));
const saveA=()=>localStorage.setItem('diviso-v3',JSON.stringify(appState));
const trip=()=>appState.trips.find(t=>t.id===view.tripId);
const person=(t,id)=>t.people.find(p=>p.id===id);
function billMath(b){let items=0,sub={};b.items.forEach(it=>{items+=+it.price||0;const who=it.who||[];if(who.length){const s=it.price/who.length;who.forEach(id=>sub[id]=(sub[id]||0)+s)}});const extra=items*((+b.tax||0)+(+b.tip||0))/100,as=Object.values(sub).reduce((a,x)=>a+x,0)||1,tot={};Object.entries(sub).forEach(([id,v])=>tot[id]=v+extra*v/as);return{grand:items+extra,tot}}
function nets(t){const bal={};t.people.forEach(p=>bal[p.id]=0);t.expenses.forEach(e=>{const sh=e.shares.length?e.shares:t.people.map(p=>p.id);bal[e.payer]+=+e.amount;sh.forEach(id=>bal[id]-=e.amount/sh.length)});t.bills.forEach(b=>{const m=billMath(b);bal[b.payer]+=m.grand;Object.entries(m.tot).forEach(([id,v])=>bal[id]-=v)});t.settlements.forEach(s=>{bal[s.from]+=s.amount;bal[s.to]-=s.amount});return bal}
function plan(bal){const d=[],c=[];Object.entries(bal).forEach(([id,v])=>{v=Math.round(v*100)/100;if(v<-0.01)d.push({id,v:-v});if(v>0.01)c.push({id,v})});const m=[];let i=0,j=0;while(i<d.length&&j<c.length){const pay=Math.min(d[i].v,c[j].v);if(pay>0.01)m.push({from:d[i].id,to:c[j].id,amount:Math.round(pay*100)/100});d[i].v-=pay;c[j].v-=pay;if(d[i].v<0.01)i++;if(c[j].v<0.01)j++}return m}
function landing(){return `<div class="wrap"><div class="nav"><div class="logo"><div class="mark">D</div> Diviso</div><button class="btn ghost" id="go-login">Accedi</button></div><div class="hero"><div><div class="ok">Gratis per il gruppo. Il conto lo tiene l'app.</div><h1>Dividi lo scontrino per quello che avete preso.</h1><p class="lead">Mista, butta, birra: ognuno segna la sua tipologia. Vedi chi deve a chi, senza fogli e senza litigare sul totale.</p></div><form class="card" id="reg"><h2 style="margin-top:0">Crea l'account</h2><p class="sub">Come in una valutazione auto: pochi dati, poi usi il servizio.</p><label>Nome</label><input name="name" required placeholder="Luca"><label>Email</label><input name="email" type="email" required placeholder="luca@email.it"><label>Password</label><input name="password" type="password" required minlength="6" placeholder="almeno 6 caratteri"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="ok" required style="width:auto"> Accetto di provare Diviso</label><div class="err">${auth.err||''}</div><button class="btn primary" type="submit">Registrati e entra</button></form></div><div class="feats"><div class="feat"><b>Per tipologia</b><p class="sub">Ogni piatto va a chi l'ha preso, non a tutti in parti uguali.</p></div><div class="feat"><b>Scontrino</b><p class="sub">Foto dello scontrino, poi assegni le righe.</p></div><div class="feat"><b>Saldi chiari</b><p class="sub">L'app dice chi paga chi. I soldi restano fuori.</p></div></div></div>`}
function login(){return `<div class="wrap" style="max-width:440px"><div class="logo"><div class="mark">D</div> Diviso</div><form class="card" id="log" style="margin-top:24px"><h2>Accedi</h2><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><div class="err">${auth.err||''}</div><button class="btn primary">Entra</button><button type="button" class="btn ghost" id="go-reg" style="width:100%">Non hai un account? Registrati</button></form></div>`}
function appHome(){return `<div class="app"><header class="appbar"><div class="mark">D</div><div><b>${session.name}</b><div class="sub">${session.email}</div></div><button class="btn ghost" id="out">Esci</button></header><div class="screens"><h2>I tuoi gruppi</h2>${appState.trips.map(t=>`<div class="row" data-open="${t.id}"><b>${t.name}</b><div class="sub">${t.people.length} persone</div></div>`).join('')}<button class="btn primary" id="new">Nuovo gruppo</button></div>${view.sheet==='new'?`<form class="card" id="ng"><h2>Nuovo gruppo</h2><input name="name" placeholder="Nome"><input name="people" placeholder="Tu, Giulia, Marco"><button class="btn primary">Crea</button></form>`:''}</div>`}
function appTrip(){const t=trip(),tab=view.tab||'bills';return `<div class="app"><header class="appbar"><button class="btn ghost" id="back">←</button><b>${t.name}</b></header><div class="screens"><div class="tabs"><button data-tab="bills" class="${tab==='bills'?'on':''}">Scontrino</button><button data-tab="bal" class="${tab==='bal'?'on':''}">Saldi</button></div>${tab==='bal'?bal(t):bills(t)}<div class="dock"><button class="btn primary" id="bill">Aggiungi tipologie</button></div></div>${view.sheet==='bill'?billSheet(t):''}</div>`}
function bills(t){return t.bills.map(b=>`<div class="row" data-bill="${b.id}"><b>${b.title}</b> ${euro(billMath(b).grand)}<div class="sub">${b.items.map(it=>it.name+' → '+((it.who||[]).map(id=>person(t,id)?.name).filter(Boolean).join(', ')||'?')).join('<br>')}</div></div>`).join('')||'<p>Nessun conto.</p>'}
function bal(t){const n=nets(t);return `<div class="sum"><b>${euro(t.bills.reduce((s,b)=>s+billMath(b).grand,0))}</b> speso</div>${t.people.map(p=>`<div class="row">${p.name} ${euro(n[p.id]||0)}</div>`).join('')}${plan(n).map(x=>`<div class="row">${person(t,x.from).name} paga ${euro(x.amount)} a ${person(t,x.to).name}</div>`).join('')}`}
function billSheet(t){const b=view.bill;return `<form class="card" id="billform"><h2>Chi ha preso cosa</h2><input name="title" value="${b.title}"><p class="sub">Segna la tipologia e tocca chi l'ha presa.</p>${b.items.map((it,i)=>`<div class="row"><input data-n="${i}" value="${it.name}" placeholder="Pizza butta"><input data-p="${i}" type="number" value="${it.price}" placeholder="Prezzo"><div>${t.people.map(p=>`<button type="button" class="chip ${(it.who||[]).includes(p.id)?'on':''}" data-who="${i}" data-id="${p.id}" style="${(it.who||[]).includes(p.id)?'background:'+p.color:''}">${p.name}</button>`).join('')}</div></div>`).join('')}<button type="button" class="btn ghost" id="add-item">+ Tipologia</button><button class="btn primary">Salva conto</button></form>`}
function render(){const root=document.getElementById('root');if(!session){root.innerHTML=auth.mode==='login'?login():landing()}else root.innerHTML=view.name==='trip'?appTrip():appHome();bind()}
function bind(){
const reg=document.getElementById('reg');if(reg)reg.onsubmit=e=>{e.preventDefault();const f=new FormData(reg);const email=String(f.get('email')).trim().toLowerCase();if(users[email]){auth.err='Email già registrata. Accedi.';render();return}users[email]={name:f.get('name'),email,password:f.get('password')};saveU();session={name:f.get('name'),email};localStorage.setItem('diviso-session',JSON.stringify(session));auth.err='';render()};
const log=document.getElementById('log');if(log)log.onsubmit=e=>{e.preventDefault();const f=new FormData(log);const email=String(f.get('email')).trim().toLowerCase();const u=users[email];if(!u||u.password!==f.get('password')){auth.err='Email o password non corretti.';render();return}session={name:u.name,email};localStorage.setItem('diviso-session',JSON.stringify(session));render()};
const gl=document.getElementById('go-login');if(gl)gl.onclick=()=>{auth={mode:'login',err:''};render()};
const gr=document.getElementById('go-reg');if(gr)gr.onclick=()=>{auth={mode:'landing',err:''};render()};
const out=document.getElementById('out');if(out)out.onclick=()=>{session=null;localStorage.removeItem('diviso-session');view={name:'home'};render()};
const nw=document.getElementById('new');if(nw)nw.onclick=()=>{view.sheet='new';render()};
const ng=document.getElementById('ng');if(ng)ng.onsubmit=e=>{e.preventDefault();const f=new FormData(ng);const people=String(f.get('people')||'Tu').split(',').map(s=>s.trim()).filter(Boolean).map((n,i)=>({id:uid(),name:n,color:C[i%C.length]}));appState.trips.unshift({id:uid(),name:f.get('name')||'Gruppo',people,expenses:[],bills:[],settlements:[]});saveA();view={name:'trip',tripId:appState.trips[0].id,tab:'bills'};render()};
document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{view={name:'trip',tripId:el.dataset.open,tab:'bills'};render()});
const back=document.getElementById('back');if(back)back.onclick=()=>{view={name:'home'};render()};
document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{view.tab=el.dataset.tab;view.sheet=null;render()});
document.querySelectorAll('[data-bill]').forEach(el=>el.onclick=()=>{view.bill=JSON.parse(JSON.stringify(trip().bills.find(b=>b.id===el.dataset.bill)));view.sheet='bill';render()});
const bill=document.getElementById('bill');if(bill)bill.onclick=()=>{view.bill={id:uid(),title:'Conto',payer:trip().people[0].id,tax:0,tip:0,items:[{name:'Pizza mista',type:'Pizza',price:0,who:[]}]};view.sheet='bill';render()};
document.querySelectorAll('[data-who]').forEach(el=>el.onclick=()=>{const b=view.bill;document.querySelectorAll('[data-n]').forEach(x=>b.items[x.dataset.n].name=x.value);document.querySelectorAll('[data-p]').forEach(x=>b.items[x.dataset.p].price=+x.value||0);const it=b.items[el.dataset.who];const id=el.dataset.id;it.who=it.who||[];it.who=it.who.includes(id)?it.who.filter(z=>z!==id):[...it.who,id];render()});
const ai=document.getElementById('add-item');if(ai)ai.onclick=()=>{view.bill.items.push({name:'',type:'',price:0,who:[]});render()};
const bf=document.getElementById('billform');if(bf)bf.onsubmit=e=>{e.preventDefault();const b=view.bill;b.title=new FormData(bf).get('title')||b.title;document.querySelectorAll('[data-n]').forEach(x=>b.items[x.dataset.n].name=x.value);document.querySelectorAll('[data-p]').forEach(x=>b.items[x.dataset.p].price=+x.value||0);const t=trip();const i=t.bills.findIndex(x=>x.id===b.id);if(i>=0)t.bills[i]=b;else t.bills.unshift(b);saveA();view.sheet=null;render()}}
render();
</script></body></html>
