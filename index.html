<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diviso</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,680&family=Outfit:wght@420;620&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1c241c;--muted:#5d6a5c;--line:#e4ddd0;--paper:#f6f1e7;--card:#fffdf8;--green:#1f6b45}
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:#ebe4d6}
.stage{min-height:100dvh;display:grid;place-items:center;padding:12px}
.phone{width:min(420px,100%);height:min(900px,100dvh);background:var(--paper);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
header{padding:16px;display:flex;gap:10px;align-items:center}h1{font-size:18px;margin:0}h2{font-family:Fraunces,serif;font-size:26px;margin:8px 0}
.sub{color:var(--muted);font-size:13px}.screens{flex:1;overflow:auto;padding:0 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;margin-right:4px}
.tabs{display:flex;gap:6px;background:#efe8db;padding:4px;border-radius:14px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px}.tabs button.on{background:#fff}
.dock{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}.btn{border:0;border-radius:14px;padding:13px;font-weight:700}.primary{background:var(--green);color:#f7f3ea;flex:1}.ghost{background:#fff;border:1px solid var(--line)}
.sheet{position:absolute;inset:0;background:rgba(28,36,28,.4);display:flex;align-items:flex-end}.box{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:16px;max-height:94%;overflow:auto}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:#fff}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;margin:3px 4px 3px 0}
.chip.on{color:#fff;border-color:transparent}
.sum{background:#144d31;color:#f6f1e7;border-radius:18px;padding:14px}.big{font-family:Fraunces,serif;font-size:30px}
.type{font-size:11px;background:#efe8db;border-radius:99px;padding:2px 8px}
</style></head><body>
<div class="stage"><div class="phone" id="app"></div></div>
<script>
const C=['#1f6b45','#c45c32','#2f5d8a','#8a5a2f','#6b4c9a'];
const euro=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const uid=()=>Math.random().toString(36).slice(2,8);
let state=JSON.parse(localStorage.getItem('diviso-v2')||'null')||{trips:[{id:'roma',name:'Cena',emoji:'🍕',people:[{id:'tu',name:'Tu',color:C[0]},{id:'giulia',name:'Giulia',color:C[1]},{id:'marco',name:'Marco',color:C[2]}],expenses:[],bills:[{id:'b1',title:'Pizzeria',payer:'tu',tax:0,tip:0,items:[{name:'Pizza mista',type:'Pizza',price:9,who:['tu']},{name:'Pizza butta',type:'Pizza',price:10,who:['giulia']},{name:'Margherita',type:'Pizza',price:8,who:['marco']},{name:'Birra',type:'Bibita',price:5,who:['tu','marco']}]}],settlements:[]}]};
let view={name:'home'};
const save=()=>localStorage.setItem('diviso-v2',JSON.stringify(state));
const trip=()=>state.trips.find(t=>t.id===view.tripId);
const person=(t,id)=>t.people.find(p=>p.id===id);
const ini=n=>n.slice(0,1);
function billMath(b){let items=0,sub={};b.items.forEach(it=>{items+=+it.price||0;const who=it.who||[];if(who.length){const s=(+it.price||0)/who.length;who.forEach(id=>sub[id]=(sub[id]||0)+s)}});const extra=items*((+b.tax||0)+(+b.tip||0))/100,as=Object.values(sub).reduce((a,b)=>a+b,0)||1,tot={};Object.entries(sub).forEach(([id,v])=>tot[id]=v+extra*v/as);return{items,grand:items+extra,tot}}
function nets(t){const bal={};t.people.forEach(p=>bal[p.id]=0);t.expenses.forEach(e=>{const sh=e.shares.length?e.shares:t.people.map(p=>p.id);bal[e.payer]+=+e.amount;sh.forEach(id=>bal[id]-=e.amount/sh.length)});t.bills.forEach(b=>{const m=billMath(b);bal[b.payer]+=m.grand;Object.entries(m.tot).forEach(([id,v])=>bal[id]-=v)});t.settlements.forEach(s=>{bal[s.from]+=s.amount;bal[s.to]-=s.amount});return bal}
function plan(bal){const d=[],c=[];Object.entries(bal).forEach(([id,v])=>{v=Math.round(v*100)/100;if(v<-0.01)d.push({id,v:-v});if(v>0.01)c.push({id,v})});const m=[];let i=0,j=0;while(i<d.length&&j<c.length){const pay=Math.min(d[i].v,c[j].v);if(pay>0.01)m.push({from:d[i].id,to:c[j].id,amount:Math.round(pay*100)/100});d[i].v-=pay;c[j].v-=pay;if(d[i].v<0.01)i++;if(c[j].v<0.01)j++}return m}
function render(){document.getElementById('app').innerHTML=view.name==='home'?home():tripView();bind()}
function home(){return `<header><div><h1>Diviso</h1><div class="sub">Per tipologia, non in parti uguali</div></div></header><div class="screens"><h2>I tuoi gruppi</h2>${state.trips.map(t=>`<article class="card" data-open="${t.id}"><b>${t.emoji} ${t.name}</b><div style="margin-top:8px">${t.people.map(p=>`<span class="av" style="background:${p.color}">${ini(p.name)}</span>`).join('')}</div></article>`).join('')}</div><div class="dock"><button class="btn primary" id="new">Nuovo gruppo</button></div>${view.sheet==='new'?`<div class="sheet" id="sheet"><div class="box"><h2>Nuovo gruppo</h2><label>Nome</label><input id="tn"><label>Persone, con virgola</label><input id="tp" value="Tu, "><button class="btn primary" id="save-trip" style="width:100%;margin-top:12px">Crea</button></div></div>`:''}`}
function tripView(){const t=trip(),tab=view.tab||'bills';return `<header><button class="btn ghost" id="back">←</button><h1>${t.name}</h1></header><div class="screens"><div class="tabs"><button data-tab="bills" class="${tab==='bills'?'on':''}">Scontrino</button><button data-tab="feed" class="${tab==='feed'?'on':''}">Spese</button><button data-tab="bal" class="${tab==='bal'?'on':''}">Saldi</button></div>${tab==='bills'?bills(t):tab==='feed'?feed(t):bal(t)}</div><div class="dock">${tab==='bal'?`<button class="btn primary" id="settle">Segna pagamento</button>`:tab==='feed'?`<button class="btn primary" id="exp">Spesa</button>`:`<button class="btn ghost" id="scan">Scansiona</button><button class="btn primary" id="bill">Conto</button>`}</div><input id="cam" type="file" accept="image/*" capture="environment" hidden>${view.sheet==='exp'?expSheet(t):''}${view.sheet==='bill'?billSheet(t):''}${view.sheet==='settle'?setSheet(t):''}${view.sheet==='scan'?`<div class="sheet"><div class="box"><h2>Lettura scontrino</h2><p class="sub">${view.scanMsg||'Apri la fotocamera...'}</p></div></div>`:''}`}
function feed(t){return t.expenses.map(e=>`<div class="card"><b>${e.title}</b><div class="sub">${person(t,e.payer)?.name} ha pagato · ${euro(e.amount)}</div></div>`).join('')||'<p>Nessuna spesa extra.</p>'}
function bills(t){return t.bills.map(b=>{const m=billMath(b);return `<div class="card" data-bill="${b.id}"><b>${b.title}</b><div class="sub">${euro(m.grand)}</div>${b.items.map(it=>`<div style="margin-top:6px"><span class="type">${it.type||'Voce'}</span> ${it.name} · ${euro(it.price)}<div class="sub">${(it.who||[]).map(id=>person(t,id)?.name).filter(Boolean).join(', ')||'non assegnato'}</div></div>`).join('')}</div>`}).join('')||'<p>Nessun conto. Scansiona lo scontrino o aggiungilo.</p>'}
function bal(t){const n=nets(t);return `<div class="sum"><div class="big">${euro(t.bills.reduce((s,b)=>s+billMath(b).grand,0)+t.expenses.reduce((s,e)=>s+ +e.amount,0))}</div><div>speso</div></div>${t.people.map(p=>{const lines=[];t.bills.forEach(b=>b.items.forEach(it=>{if((it.who||[]).includes(p.id))lines.push(it.name)}));return `<div class="card"><span class="av" style="background:${p.color}">${ini(p.name)}</span><b>${p.name}</b> ${euro(n[p.id]||0)}<div class="sub">${lines.join(', ')||'niente assegnato'}</div></div>`}).join('')}${plan(n).map(x=>`<div class="card">${person(t,x.from).name} paga ${euro(x.amount)} a ${person(t,x.to).name}</div>`).join('')}`}
function expSheet(t){return `<div class="sheet" id="sheet"><div class="box"><h2>Spesa</h2><label>Cosa</label><input id="et"><label>Importo</label><input id="ea" type="number"><label>Ha pagato</label><select id="ep">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div id="shares">${t.people.map(p=>`<button type="button" class="chip on" data-id="${p.id}">${p.name}</button>`).join('')}</div><button class="btn primary" id="save-exp" style="width:100%;margin-top:12px">Aggiungi</button></div></div>`}
function setSheet(t){return `<div class="sheet" id="sheet"><div class="box"><h2>Pagamento</h2><select id="sf">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><select id="st">${t.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><input id="sa" type="number" placeholder="Importo"><button class="btn primary" id="save-set" style="width:100%;margin-top:12px">Registra</button></div></div>`}
function billSheet(t){const b=view.bill,m=billMath(b);return `<div class="sheet" id="sheet"><div class="box"><h2>Chi ha preso cosa</h2><label>Locale</label><input id="bt" value="${b.title}"><label>Ha pagato il conto</label><select id="bp">${t.people.map(p=>`<option value="${p.id}" ${p.id===b.payer?'selected':''}>${p.name}</option>`).join('')}</select><p class="sub">Tocca il nome di chi ha preso quella tipologia. Se sono in due, il prezzo si divide.</p>${b.items.map((it,i)=>`<div class="card"><input data-n="${i}" value="${it.name}" placeholder="Pizza mista"><div style="display:grid;grid-template-columns:1fr 90px;gap:6px;margin-top:6px"><input data-ty="${i}" value="${it.type||''}" placeholder="Pizza"><input data-p="${i}" type="number" value="${it.price}"></div><div>${t.people.map(p=>`<button type="button" class="chip ${ (it.who||[]).includes(p.id)?'on':''}" data-who="${i}" data-id="${p.id}" style="${(it.who||[]).includes(p.id)?'background:'+p.color:''}">${p.name}</button>`).join('')}</div></div>`).join('')}<button class="btn ghost" id="add-item">+ Tipologia</button><div class="sum" style="margin-top:10px"><div class="big">${euro(m.grand)}</div><div>${Object.entries(m.tot).map(([id,v])=>person(t,id).name+' '+euro(v)).join(' · ')||'Assegna le voci'}</div></div><button class="btn primary" id="save-bill" style="width:100%;margin-top:8px">Salva</button></div></div>`}
function sync(){const b=view.bill;if(!b)return;const bt=document.getElementById('bt');if(bt)b.title=bt.value;const bp=document.getElementById('bp');if(bp)b.payer=bp.value;document.querySelectorAll('[data-n]').forEach(el=>b.items[el.dataset.n].name=el.value);document.querySelectorAll('[data-ty]').forEach(el=>b.items[el.dataset.ty].type=el.value);document.querySelectorAll('[data-p]').forEach(el=>b.items[el.dataset.p].price=+el.value||0)}
function parseLines(text){return text.split(/\n/).map(s=>s.trim()).map(line=>{const m=line.match(/^(.*?)\s+(\d+[.,]\d{2}|\d+[.,]\d+|\d+)\s*€?$/);if(!m)return null;const name=m[1].replace(/[*\-]+/g,'').trim();if(name.length<2)return null;return{name,type:name.split(' ')[0],price:+m[2].replace(',','.'),who:[]}}).filter(Boolean)}
async function scanFile(file){view.sheet='scan';view.scanMsg='Leggo lo scontrino, può volerci mezzo minuto...';render();try{if(!window.Tesseract){await new Promise((ok,err)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=err;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'ita+eng');const items=parseLines(r.data.text||'');view.bill={id:uid(),title:'Scontrino',payer:trip().people[0].id,tax:0,tip:0,items:items.length?items:[{name:'Voce non letta',type:'Altro',price:0,who:[]}]};view.sheet='bill';view.rawScan=r.data.text;render()}catch(e){view.scanMsg='Non sono riuscito a leggere la foto. Aggiungi le voci a mano.';render()}}
function bind(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{view={name:'trip',tripId:el.dataset.open,tab:'bills'};render()});
const back=document.getElementById('back');if(back)back.onclick=()=>{view={name:'home'};render()};
const nw=document.getElementById('new');if(nw)nw.onclick=()=>{view.sheet='new';render()};
const st=document.getElementById('save-trip');if(st)st.onclick=()=>{const people=document.getElementById('tp').value.split(',').map(s=>s.trim()).filter(Boolean).map((n,i)=>({id:uid(),name:n,color:C[i%C.length]}));state.trips.unshift({id:uid(),name:document.getElementById('tn').value||'Gruppo',emoji:'✨',people,expenses:[],bills:[],settlements:[]});save();view={name:'trip',tripId:state.trips[0].id,tab:'bills'};render()};
document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{view.tab=el.dataset.tab;view.sheet=null;render()});
document.querySelectorAll('[data-bill]').forEach(el=>el.onclick=()=>{view.bill=JSON.parse(JSON.stringify(trip().bills.find(b=>b.id===el.dataset.bill)));view.sheet='bill';render()});
const exp=document.getElementById('exp');if(exp)exp.onclick=()=>{view.sheet='exp';render()};
const bill=document.getElementById('bill');if(bill)bill.onclick=()=>{view.bill={id:uid(),title:'Conto',payer:trip().people[0].id,tax:0,tip:0,items:[{name:'Pizza mista',type:'Pizza',price:0,who:[]},{name:'Pizza butta',type:'Pizza',price:0,who:[]}]};view.sheet='bill';render()};
const scan=document.getElementById('scan');const cam=document.getElementById('cam');if(scan)scan.onclick=()=>cam.click();if(cam)cam.onchange=()=>{if(cam.files[0])scanFile(cam.files[0])};
const settle=document.getElementById('settle');if(settle)settle.onclick=()=>{view.sheet='settle';render()};
const sheet=document.getElementById('sheet');if(sheet)sheet.onclick=e=>{if(e.target.id==='sheet'){view.sheet=null;render()}};
document.querySelectorAll('#shares .chip').forEach(el=>el.onclick=()=>el.classList.toggle('on'));
const se=document.getElementById('save-exp');if(se)se.onclick=()=>{const t=trip();const shares=[...document.querySelectorAll('#shares .chip.on')].map(el=>el.dataset.id);t.expenses.unshift({id:uid(),title:document.getElementById('et').value||'Spesa',amount:+document.getElementById('ea').value||0,payer:document.getElementById('ep').value,shares});save();view.sheet=null;render()};
const ss=document.getElementById('save-set');if(ss)ss.onclick=()=>{const from=document.getElementById('sf').value,to=document.getElementById('st').value,amount=+document.getElementById('sa').value||0;if(from!==to&&amount>0)trip().settlements.push({from,to,amount});save();view.sheet=null;render()};
document.querySelectorAll('[data-who]').forEach(el=>el.onclick=()=>{sync();const it=view.bill.items[el.dataset.who];const id=el.dataset.id;it.who=it.who||[];it.who=it.who.includes(id)?it.who.filter(x=>x!==id):[...it.who,id];render()});
const ai=document.getElementById('add-item');if(ai)ai.onclick=()=>{sync();view.bill.items.push({name:'',type:'',price:0,who:[]});render()};
const sb=document.getElementById('save-bill');if(sb)sb.onclick=()=>{sync();const t=trip();const i=t.bills.findIndex(b=>b.id===view.bill.id);if(i>=0)t.bills[i]=view.bill;else t.bills.unshift(view.bill);save();view.sheet=null;view.tab='bills';render()}}
render();
</script></body></html>
