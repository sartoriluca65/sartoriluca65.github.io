<svg xmlns="http://w3.org" width="1200" height="850" viewBox="0 0 1200 850" shape-rendering="geometricPrecision">
  <defs>
    <!-- Forchetta standard -->
    <g id="f" fill="currentColor">
      <path d="M0-110 c-3 0-5 2-5 6 v22 c0 4 3 8 7 9 v53 c0 3 1.5 5 4.5 5 s4.5-2 4.5-5 v-53 c4-1 7-5 7-9 v-22 c0-4-2-6-5-6 v20 h-2 v-20 h-2 v20 h-2 v-20 h-2 v20 h-2 v-20 h-2 v20 z" transform="scale(1.2)"/>
    </g>
    <!-- Cucchiaio standard -->
    <g id="s" fill="currentColor">
      <path d="M0-112 c-7.5 0-12 8-12 17 c0 9 4.5 14 9.5 16.5 v58 c0 3 2 5 4.5 5 s4.5-2 4.5-5 v-58 c5-2.5 9.5-7.5 9.5-16.5 c0-9-4.5-17-12-17 z" transform="scale(1.15)"/>
    </g>
    <!-- Coltello standard -->
    <g id="k" fill="currentColor">
      <path d="M-0.5-112 c6.5 7.5 10.5 17 10 26 c-0.5 6-3.5 10.5-7.5 14 v52 c0 3-2 5-5 5 s-5-2-5-5 v-52 c-4-3.5-6.5-8-7.5-14 c-0.5-9 3.5-18.5 10.5-26 z" transform="scale(1.2)"/>
    </g>
  </defs>

  <!-- Sfondo trasparente come da originale -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- GRUPPO RAGGIERA POSATE (Coordinate e rotazioni estratte dall'immagine) -->
  <g transform="translate(600, 415)">
    
    <!-- Quadrante Superiore Sinistro -->
    <g transform="rotate(-68)" color="#07589a"><use href="#s" transform="scale(0.9)"/></g>
    <g transform="rotate(-52)" color="#65b4d7"><use href="#f" transform="scale(0.6) translate(0, -30)"/></g>
    <g transform="rotate(-40)" color="#65b4d7"><use href="#k" transform="scale(1.2)"/></g>
    <g transform="rotate(-28)" color="#74c9b5"><use href="#f" transform="scale(0.7) translate(0, -20)"/></g>
    <g transform="rotate(-15)" color="#74c9b5"><use href="#s" transform="scale(0.8)"/></g>
    <g transform="rotate(-8)" color="#f4a02f"><use href="#s" transform="scale(0.5) translate(0, -40)"/></g>
    
    <!-- Centro Superiore (Forchetta Blu dritta) -->
    <g transform="rotate(0)" color="#07589a"><use href="#f" transform="scale(1.3)"/></g>
    
    <!-- Quadrante Superiore Destro -->
    <g transform="rotate(10)" color="#65b4d7"><use href="#k" transform="scale(0.5) translate(0, -50)"/></g>
    <g transform="rotate(22)" color="#f4a02f"><use href="#f" transform="scale(1.1)"/></g>
    <g transform="rotate(38)" color="#74c9b5"><use href="#k" transform="scale(1.2)"/></g>
    <g transform="rotate(48)" color="#07589a"><use href="#s" transform="scale(0.6) translate(0, -20)"/></g>
    <g transform="rotate(58)" color="#07589a"><use href="#f" transform="scale(1.0)"/></g>
    
    <!-- Lato Destro Orizzontale -->
    <g transform="rotate(78)" color="#65b4d7"><use href="#s" transform="scale(0.8) translate(0, 10)"/></g>
    <g transform="rotate(86)" color="#07589a"><use href="#s" transform="scale(1.4) translate(0, -30)"/></g>
    <g transform="rotate(94)" color="#74c9b5"><use href="#f" transform="scale(0.5) translate(0, -50)"/></g>
    <g transform="rotate(105)" color="#f4a02f"><use href="#k" transform="scale(1.5) translate(0, -20)"/></g>
    
    <!-- Quadrante Inferiore Destro -->
    <g transform="rotate(122)" color="#65b4d7"><use href="#s" transform="scale(0.7)"/></g>
    <g transform="rotate(134)" color="#07589a"><use href="#s" transform="scale(0.6) translate(0, -10)"/></g>
    <g transform="rotate(145)" color="#74c9b5"><use href="#s" transform="scale(1.1)"/></g>
    <g transform="rotate(156)" color="#65b4d7"><use href="#k" transform="scale(1.3)"/></g>
    <g transform="rotate(164)" color="#f4a02f"><use href="#f" transform="scale(0.8)"/></g>
    <g transform="rotate(174)" color="#74c9b5"><use href="#k" transform="scale(0.5) translate(0, -30)"/></g>
    
    <!-- Centro Inferiore (Forchetta Arancione dritta) -->
    <g transform="rotate(180)" color="#f4a02f"><use href="#f" transform="scale(1.3)"/></g>
    
    <!-- Quadrante Inferiore Sinistro -->
    <g transform="rotate(188)" color="#07589a"><use href="#f" transform="scale(0.6) translate(0, -20)"/></g>
    <g transform="rotate(196)" color="#65b4d7"><use href="#k" transform="scale(0.5) translate(0, -40)"/></g>
    <g transform="rotate(208)" color="#65b4d7"><use href="#s" transform="scale(1.2)"/></g>
    <g transform="rotate(222)" color="#07589a"><use href="#s" transform="scale(0.7) translate(0, -10)"/></g>
    <g transform="rotate(234)" color="#74c9b5"><use href="#k" transform="scale(0.9)"/></g>
    <g transform="rotate(246)" color="#f4a02f"><use href="#s" transform="scale(0.8)"/></g>
    <g transform="rotate(254)" color="#07589a"><use href="#f" transform="scale(1.1)"/></g>
    <g transform="rotate(264)" color="#65b4d7"><use href="#s" transform="scale(0.6) translate(0, -30)"/></g>
    
    <!-- Lato Sinistro Orizzontale -->
    <g transform="rotate(274)" color="#f4a02f"><use href="#f" transform="scale(1.3) translate(0, -20)"/></g>
    <g transform="rotate(285)" color="#07589a"><use href="#s" transform="scale(0.9) translate(0, -20)"/></g>
    <g transform="rotate(296)" color="#65b4d7"><use href="#f" transform="scale(0.5) translate(0, -40)"/></g>
    <g transform="rotate(308)" color="#74c9b5"><use href="#k" transform="scale(1.4) translate(0, -10)"/></g>

    <!-- Elementi di riempimento esterni (linee ed elementi minori sfalsati) -->
    <path d="M-190,-60 L-260,-65 M-195,-50 L-255,-52" stroke="#07589a" stroke-width="6" stroke-linecap="round" />
    <path d="M-210,130 L-295,145" stroke="#07589a" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- MASCHERA DI SFUMATURA CENTRALE (Isola il testo mantenendo i bordi morbidi) -->
  <circle cx="600" cy="415" r="190" fill="#fff" opacity="0.95"/>

  <!-- BLOCCO TESTO LOGO "DIVISO" -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="-2">
    <!-- D - Blu Scuro -->
    <text x="270" y="465" fill="#07589a" transform="scale(1.1, 1)">D</text>
    <!-- I - Azzurro -->
    <text x="410" y="465" fill="#65b4d7" font-weight="800">I</text>
    <!-- V - Verde Scuro / Alpi -->
    <text x="460" y="465" fill="#0e7a46">V</text>
    <!-- I - Arancione -->
    <text x="565" y="465" fill="#f4a02f" font-weight="800">I</text>
    <!-- S - Blu Elettrico -->
    <text x="615" y="465" fill="#1b75bc">S</text>
  </g>

  <!-- LETTERA "O" IN VERSIONE GRAFICA CUSTOM (Piatto + Mirino concentrico) -->
  <g transform="translate(810, 412)">
    <!-- Cerchio Esterno Piatto -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#74c9b5" stroke-width="15"/>
    <!-- Anello Interno Intermedio -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#74c9b5" stroke-width="4" stroke-dasharray="1 1"/>
    <!-- Ellis/Ovale Centrale Interno -->
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="none" stroke="#74c9b5" stroke-width="5"/>
  </g>
</svg>
