<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" shape-rendering="geometricPrecision" role="img" aria-labelledby="title desc">
  <title id="title">DIVISO</title>
  <desc id="desc">Logo DIVISO con posate colorate disposte a raggiera</desc>
  <defs>
    <!-- Forchetta -->
    <g id="fork" fill="currentColor">
      <path d="M-6 -50 v25 c0 4 2 7 6 8 v40 h4 v-40 c4 -1 6 -4 6 -8 v-25 h-2 v18 h-2 v-18 h-2 v18 h-2 v-18 h-2 v18 h-2 v-18 h-2 v18 h-2 v-18 Z"/>
    </g>
    <!-- Cucchiaio -->
    <g id="spoon" fill="currentColor">
      <path d="M0 -52 c-7 0 -11 7 -11 17 c0 9 4 15 9 17 v43 h4 v-43 c5 -2 9 -8 9 -17 c0 -10 -4 -17 -11 -17 Z"/>
    </g>
    <!-- Coltello -->
    <g id="knife" fill="currentColor">
      <path d="M-1 -52 c7 8 11 v38 c0 5 -2 7 -5 7 v34 h-4 v-34 c-4 0 -5 -2 -5 -7 v-26 c-3 -4 -5 -8 -5 -14 c0 -10 4 -20 11 -28 Z"/>
    </g>
    <!-- Sfumatura per il testo principale -->
    <linearGradient id="wordColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07589a"/>
      <stop offset="33%" stop-color="#65b4d7"/>
      <stop offset="66%" stop-color="#74c9b5"/>
      <stop offset="100%" stop-color="#f4a02f"/>
    </linearGradient>
  </defs>

  <!-- Sfondo Neutro Trasparente / Bianco -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Raggiera di Posate ed Elementi Grafici -->
  <g transform="translate(300, 200)">
    <!-- Gruppo Blu Scuro (#07589a) -->
    <g transform="rotate(0)" color="#07589a"><use href="#fork" transform="translate(0, -115) scale(0.65)"/><circle cx="0" cy="-155" r="4.5"/></g>
    <g transform="rotate(90)" color="#07589a"><use href="#knife" transform="translate(0, -110) scale(0.65)"/><circle cx="0" cy="-150" r="3.5"/></g>
    <g transform="rotate(180)" color="#07589a"><use href="#spoon" transform="translate(0, -125) scale(0.65)"/><circle cx="0" cy="-160" r="5"/></g>
    <g transform="rotate(270)" color="#07589a"><use href="#fork" transform="translate(0, -115) scale(0.65)"/><circle cx="0" cy="-145" r="4"/></g>

    <!-- Gruppo Azzurro (#65b4d7) -->
    <g transform="rotate(30)" color="#65b4d7"><use href="#spoon" transform="translate(0, -120) scale(0.65)"/><circle cx="0" cy="-160" r="4"/></g>
    <g transform="rotate(120)" color="#65b4d7"><use href="#fork" transform="translate(0, -110) scale(0.65)"/><circle cx="0" cy="-145" r="4.5"/></g>
    <g transform="rotate(210)" color="#65b4d7"><use href="#knife" transform="translate(0, -125) scale(0.65)"/><circle cx="0" cy="-155" r="3.5"/></g>
    <g transform="rotate(300)" color="#65b4d7"><use href="#spoon" transform="translate(0, -115) scale(0.65)"/><circle cx="0" cy="-150" r="5"/></g>

    <!-- Gruppo Verde Acqua (#74c9b5) -->
    <g transform="rotate(60)" color="#74c9b5"><use href="#knife" transform="translate(0, -125) scale(0.65)"/><circle cx="0" cy="-155" r="3.5"/></g>
    <g transform="rotate(150)" color="#74c9b5"><use href="#spoon" transform="translate(0, -115) scale(0.65)"/><circle cx="0" cy="-150" r="5"/></g>
    <g transform="rotate(240)" color="#74c9b5"><use href="#fork" transform="translate(0, -120) scale(0.65)"/><circle cx="0" cy="-160" r="4.5"/></g>
    <g transform="rotate(330)" color="#74c9b5"><use href="#knife" transform="translate(0, -110) scale(0.65)"/><circle cx="0" cy="-145" r="4"/></g>

    <!-- Gruppo Arancione (#f4a02f) -->
    <g transform="rotate(45)" color="#f4a02f"><use href="#fork" transform="translate(0, -110) scale(0.55)"/><circle cx="0" cy="-140" r="3"/></g>
    <g transform="rotate(135)" color="#f4a02f"><use href="#knife" transform="translate(0, -120) scale(0.55)"/><circle cx="0" cy="-150" r="4"/></g>
    <g transform="rotate(225)" color="#f4a02f"><use href="#spoon" transform="translate(0, -115) scale(0.55)"/><circle cx="0" cy="-145" r="3.5"/></g>
    <g transform="rotate(315)" color="#f4a02f"><use href="#fork" transform="translate(0, -125) scale(0.55)"/><circle cx="0" cy="-155" r="4"/></g>

    <!-- Linee sottili radiali di accento intercalate -->
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(15)" stroke="#65b4d7" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(75)" stroke="#74c9b5" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(105)" stroke="#f4a02f" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(165)" stroke="#07589a" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(195)" stroke="#65b4d7" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(255)" stroke="#74c9b5" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(285)" stroke="#f4a02f" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-75" x2="0" y2="-90" transform="rotate(345)" stroke="#07589a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Maschera sfumata centrale per isolare il testo -->
  <circle cx="300" cy="200" r="85" fill="#fff" opacity="0.9"/>

  <!-- Testo Centrale "DIVISO" -->
  <text x="300" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="bold" letter-spacing="4">
    <!-- Parola sfumata con l'ultima lettera con colore pieno e mirino -->
    <tspan fill="url(#wordColor)">DIVIS</tspan><tspan fill="#07589a">O</tspan>
  </text>
  
  <!-- Dettaglio grafico interno alla lettera O (Mirino/Piatto) -->
  <g transform="translate(435, 196)" stroke="#74c9b5" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="14" opacity="0.8"/>
    <line x1="-6" y1="0" x2="6" y2="0"/>
  </g>
</svg>
