    <path d="M260,345 h30 c28,0 48,18 48,55 v2 c0,37 -20,55 -48,55 h-30 v-8 h30 c22,0 39,-14 39,-47 v-2 c0,-33 -17,-47 -39,-47 h-30 z"/>
    
    <!-- I iniziale con Grafica Posate (Forchetta + Coltello + Piatto Centrale incorporati) -->
    <g transform="translate(375, 401)" fill="#07589a">
      <!-- Forchetta Mini dell'asta sinistra -->
      <path d="M-22,-52 h4 v42 c0,3 1,4 3,4 v4 h-10 v-4 c2,0 3,-1 3,-4 v-42 h-3 v12 h-1 v-12 h-1 v12 h-1 v-12 h-1 v12 h-1 v-12 z" transform="scale(1.1)"/>
      <!-- Cerchio/Piatto centrale -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#07589a" stroke-width="5"/>
      <circle cx="0" cy="0" r="14" fill="#07589a"/>
      <!-- Coltello Mini dell'asta destra -->
      <path d="M18,-52 c3,4 5,9 5,14 c0,5 -2,7 -4,9 v29 c0,3 1,4 3,4 v4 h-10 v-4 c2,0 3,-1 3,-4 v-32 c-2,-2 -3,-5 -3,-7 c0,-6 2,-13 4,-18 z" transform="scale(1.1)"/>
    </g>

    <!-- V minimale -->
    <path d="M440,345 h9 l24,86 l24,-86 h9 l-30,107 h-6 z"/>

    <!-- I centrale (Asta Lineare Semplice) -->
    <path d="M532,345 h8 v107 h-8 z"/>

    <!-- D secondaria -->
    <path d="M575,345 h30 c28,0 48,18 48,55 v2 c0,37 -20,55 -48,55 h-30 v-8 h30 c22,0 39,-14 39,-47 v-2 c0,-33 -17,-47 -39,-47 h-30 z"/>

    <!-- I finale (Asta Lineare Semplice) -->
    <path d="M685,345 h8 v107 h-8 z"/>
  </g>

